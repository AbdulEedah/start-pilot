services:
  - type: web
    name: startpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate && python manage.py seed_prompt_templates && python manage.py ensure_superuser && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: lawalabdurrahim5401@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: 5401abdul
      - key: DATABASE_URL
        fromDatabase:
          name: startpilot-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://startpilot.vercel.app

databases:
  - name: startpilot-db
    plan: free
    databaseName: startpilot
    user: startpilot
