[flake8]
max-line-length = 100
exclude =
    migrations,
    __pycache__,
    .git,
    venv,
    .venv
per-file-ignores =
    */settings/*.py:F401,F403,F405

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 100
known_django = django
known_third_party = rest_framework,celery,factory,faker
known_first_party = apps,config
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[mypy]
python_version = 3.12
ignore_missing_imports = True
